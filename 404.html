<body class="d-flex flex-column min-vh-100">

  <!-- Top Sticky Header -->

      <a href="index.html" class="navbar-brand-logo"><img src="assets/images/logo.svg" alt="STUDIO CULT Logo" width="130" height="34" class="brand-logo-light"><img src="assets/images/logo-white.svg" alt="STUDIO CULT Logo" width="130" height="34" class="brand-logo-dark"></a>

        <button class="theme-toggle-btn" type="button" aria-label="Toggle dark/light mode" title="Toggle Dark Mode"><i class="fa-solid fa-moon"></i></button>

      <!-- Animated 404 Floating Badge -->
      <div class="position-relative d-inline-block mb-4">
        <div class="hero-orbit-ring orbit-ring-outer animate-spin-slow" style="width: 220px; height: 220px; top: calc(50% - 110px); left: calc(50% - 110px);"></div>

          404
        </div>
      </div>

      <span class="eyebrow eyebrow-mint mb-3"><span class="dot"></span> Lost in the Feed</span>

      <p class="lead mb-4">
        The link you followed may be broken, or the page might have been retired. Let’s guide you back to your workspace.

      <!-- Search Bar -->
      <form action="blog.html" method="GET" class="footer-input-group mx-auto mb-4" style="max-width: 440px;">
        <input type="text" placeholder="Search articles or features..." required aria-label="Search site">
        <button type="submit" class="btn-cult btn-cult-primary">Search <i class="fa-solid fa-magnifying-glass"></i></button>
      </form>

      <!-- Action Links -->
      <div class="d-flex flex-wrap justify-content-center gap-3">
        <a href="index.html" class="btn-cult btn-cult-primary">Return to Homepage <i class="fa-solid fa-arrow-right"></i></a>
        <a href="contact.html" class="btn-cult btn-cult-outline">Contact 24/7 Support</a>
